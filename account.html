<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account · Tabitha's Misery</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="main" class="page page--pushed page--narrow !gap-5 md:!gap-6">
    <section aria-label="Profile" class="card p-4 md:p-5 flex flex-col gap-3.5">
        <div class="flex gap-3.5 items-center">
            <span class="avatar !w-12 !h-12 font-serif !text-[24px] !font-normal" id="profile-initial" aria-hidden="true"></span>
            <span class="flex flex-col min-w-0">
                <span class="font-serif text-[23px] leading-[28px] truncate" id="profile-name"></span>
                <span class="text-body-s text-muted truncate" id="profile-email"></span>
            </span>
        </div>
        <form id="name-form" novalidate>
            <label for="display-name" class="field-label">Display name</label>
            <div class="flex gap-2">
                <input id="display-name" class="field !h-12 flex-1 min-w-0" autocomplete="nickname" maxlength="40">
                <button type="submit" class="btn btn-primary" id="name-save" disabled>Save</button>
            </div>
            <span class="field-help">Used in the greeting on Home. Save turns on when you change it.</span>
        </form>
    </section>

    <section aria-labelledby="signin-heading" class="flex flex-col gap-2">
        <h2 id="signin-heading" class="eyebrow">Sign-in</h2>
        <div class="list-card">
            <button type="button" class="list-row" id="password-btn">
                <span class="ms text-[22px]" aria-hidden="true">lock</span>
                <span class="flex-1 min-w-0 flex flex-col"><span class="text-[15px] font-medium">Change password</span><span class="text-label text-muted truncate">The one you sign in to this app with</span></span>
                <span class="ms text-[20px] text-faint" aria-hidden="true">chevron_right</span>
            </button>
            <button type="button" class="list-row" id="grants-btn">
                <span class="ms text-[22px]" aria-hidden="true">link</span>
                <span class="flex-1 min-w-0 flex flex-col"><span class="text-[15px] font-medium">Connected apps</span><span class="text-label text-muted truncate" id="grants-status">Apps like Claude that you've allowed in</span></span>
                <span class="ms text-[20px] text-faint" aria-hidden="true">chevron_right</span>
            </button>
        </div>
    </section>

    <section aria-labelledby="data-heading" class="flex flex-col gap-2">
        <h2 id="data-heading" class="eyebrow">Your data</h2>
        <div class="list-card">
            <a href="import.html" class="list-row">
                <span class="ms text-[22px]" aria-hidden="true">move_to_inbox</span>
                <span class="flex-1 min-w-0 flex flex-col"><span class="text-[15px] font-medium">Import bank emails</span><span class="text-label text-muted truncate" id="import-status">Not connected yet</span></span>
                <span class="ms text-[20px] text-faint" aria-hidden="true">chevron_right</span>
            </a>
            <a href="categories.html#rules" class="list-row">
                <span class="ms text-[22px]" aria-hidden="true">rule</span>
                <span class="flex-1 min-w-0 flex flex-col"><span class="text-[15px] font-medium">Categories and rules</span><span class="text-label text-muted" id="rules-status">&nbsp;</span></span>
                <span class="ms text-[20px] text-faint" aria-hidden="true">chevron_right</span>
            </a>
            <button type="button" class="list-row" id="export-btn">
                <span class="ms text-[22px]" aria-hidden="true">download</span>
                <span class="flex-1 min-w-0 flex flex-col"><span class="text-[15px] font-medium">Export all transactions</span><span class="text-label text-muted" id="export-status">CSV file, every month</span></span>
            </button>
        </div>
    </section>

    <section aria-labelledby="notif-heading" class="flex flex-col gap-2" id="notif-section" hidden>
        <h2 id="notif-heading" class="eyebrow">Notifications</h2>
        <div class="card-m px-4 py-1">
            <label class="flex items-center justify-between gap-4 min-h-[64px] cursor-pointer">
                <span class="flex flex-col gap-0.5"><span class="text-[15px] font-medium">Budget alerts</span><span class="text-label text-muted">Tell me when a budget runs over</span></span>
                <input type="checkbox" class="sr-only" id="notif-toggle" role="switch">
                <span class="toggle" aria-hidden="true"></span>
            </label>
        </div>
    </section>

    <button type="button" class="btn btn-secondary btn-lg !text-negative" id="sign-out"><span class="ms text-[20px]" aria-hidden="true">logout</span>Sign out</button>

    <footer class="flex flex-col items-center gap-0.5 pt-2">
        <span class="wordmark text-[20px]">Tabitha's <em>Misery</em></span>
        <span class="text-caption text-muted" id="version"></span>
    </footer>
</main>

<script src="vendor/supabase.min.js"></script>
<script src="js/format.js"></script>
<script src="js/app.js"></script>
<script src="js/account.js"></script>
</body>
</html>
