<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Tabitha's Misery</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main class="mx-auto w-full max-w-[420px] px-5 flex flex-col gap-7" style="padding-top: calc(56px + var(--safe-top)); padding-bottom: calc(32px + var(--safe-bottom))">
    <div class="flex flex-col gap-3">
        <div class="font-serif text-[20px] text-faint tracking-[0.02em] whitespace-nowrap overflow-hidden tnum" aria-hidden="true">−Rp 32.000 · −Rp 87.500 · −Rp 24.000 ·</div>
        <h1 class="wordmark text-[48px] !leading-[48px]">Tabitha's<br><em>Misery</em></h1>
        <p class="text-body text-text-2 max-w-[300px]">Where your money went, whether you're within budget, and what it was all for.</p>
    </div>

    <form id="auth-form" class="flex flex-col gap-4" novalidate>
        <div class="seg grid-cols-2" role="tablist" aria-label="Account">
            <button type="button" role="tab" aria-selected="true" data-mode="signin">Sign in</button>
            <button type="button" role="tab" aria-selected="false" data-mode="signup">Create account</button>
        </div>
        <div>
            <label for="auth-email" class="field-label">Email</label>
            <input id="auth-email" type="email" class="field" autocomplete="email" inputmode="email" placeholder="you@example.com">
        </div>
        <div>
            <label for="auth-password" class="field-label">Password</label>
            <div class="field-wrap" id="password-wrap">
                <input id="auth-password" type="password" autocomplete="current-password" aria-describedby="password-help">
                <button type="button" class="icon-btn text-muted" id="password-toggle" aria-label="Show password" aria-pressed="false"><span class="ms text-[22px]" aria-hidden="true">visibility</span></button>
            </div>
            <span id="password-help" class="field-help" hidden>At least 8 characters.</span>
        </div>
        <div id="auth-error" role="alert" class="banner banner--error" hidden></div>
        <button type="submit" class="btn btn-primary btn-lg mt-1" id="auth-submit">Sign in</button>
    </form>
</main>

<script src="vendor/supabase.min.js"></script>
<script src="js/format.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
