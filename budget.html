<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget · Tabitha's Misery</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="main" class="page !gap-4 md:!gap-6" aria-busy="true">
    <div class="flex flex-wrap gap-4 items-center justify-between">
        <h1 class="page-title">Budget</h1>
        <button type="button" class="btn-pill md:hidden" data-new-budget><span class="ms text-[20px]" aria-hidden="true">add</span>Set budget</button>
        <div class="hidden md:flex flex-wrap gap-3 items-center">
            <div class="flex items-center gap-2" data-month-host="pill"></div>
            <button type="button" class="btn btn-primary pl-3.5 pr-[18px]" data-new-budget><span class="ms text-[22px]" aria-hidden="true">add</span>Set budget</button>
        </div>
    </div>
    <div class="md:hidden" data-month-host="switcher"></div>

    <div id="budget-content" class="flex flex-col gap-4 md:gap-6">
        <section class="card p-4 flex flex-col gap-3" aria-label="All budgets">
            <span class="text-body-s text-muted">Spent against budgets</span>
            <span class="skeleton w-56 max-w-full h-11 rounded-s"></span>
            <span class="skeleton w-full h-3 rounded-full"></span>
            <span class="skeleton w-[60%] h-3"></span>
        </section>
        <div class="card-m p-4 flex flex-col gap-3" aria-hidden="true"><span class="flex gap-3 items-center"><span class="skeleton w-10 h-10 rounded-tile"></span><span class="skeleton h-4 w-40"></span></span><span class="skeleton h-2 w-full rounded-full"></span></div>
        <div class="card-m p-4 flex flex-col gap-3" aria-hidden="true"><span class="flex gap-3 items-center"><span class="skeleton w-10 h-10 rounded-tile"></span><span class="skeleton h-4 w-32"></span></span><span class="skeleton h-2 w-full rounded-full"></span></div>
    </div>
</main>

<script src="vendor/supabase.min.js"></script>
<script src="js/format.js"></script>
<script src="js/app.js"></script>
<script src="js/budget.js"></script>
</body>
</html>
