<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity · Tabitha's Misery</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="main" class="page !gap-4 md:!gap-5" aria-busy="true">
    <div class="flex flex-wrap gap-4 items-center justify-between">
        <h1 class="page-title">Activity</h1>
        <div class="hidden md:flex flex-wrap gap-3 items-center">
            <div class="flex items-center gap-2" data-month-host="pill"></div>
            <a href="import.html" class="btn btn-secondary pl-3"><span class="ms text-[22px]" aria-hidden="true">move_to_inbox</span>Import</a>
            <a href="add-transaction.html" class="btn btn-primary pl-3.5 pr-[18px]"><span class="ms text-[22px]" aria-hidden="true">add</span>Add transaction</a>
        </div>
    </div>
    <div class="md:hidden" data-month-host="switcher"></div>

    <div id="tools" class="flex flex-col md:flex-row md:flex-wrap md:items-center gap-4 md:gap-3">
        <div class="search md:flex-[1_1_280px] md:h-11">
            <span class="ms text-[20px] text-muted" aria-hidden="true">search</span>
            <input id="search" type="search" placeholder="Search merchant or amount" aria-label="Search transactions" autocomplete="off" enterkeyhint="search">
            <button type="button" id="search-clear" class="icon-btn w-8 h-8 text-muted" aria-label="Clear search" hidden><span class="ms text-[20px]" aria-hidden="true">close</span></button>
        </div>
        <div role="group" aria-label="Filter" class="flex flex-wrap gap-2" id="filters"></div>
        <span id="desk-summary" class="hidden md:inline ml-auto text-body-s text-text-2 whitespace-nowrap tnum"></span>
    </div>

    <div id="summary" class="md:hidden"></div>

    <div id="list" class="flex flex-col">
        <div class="flex flex-col gap-3.5 pt-2" aria-hidden="true">
            <div class="flex gap-3 items-center"><span class="skeleton w-10 h-10 rounded-tile"></span><span class="flex-1 flex flex-col gap-1.5"><span class="skeleton h-3.5 w-[70%] rounded"></span><span class="skeleton h-2.5 w-[45%] rounded"></span></span><span class="skeleton h-3.5 w-[72px] rounded"></span></div>
            <div class="flex gap-3 items-center"><span class="skeleton w-10 h-10 rounded-tile"></span><span class="flex-1 flex flex-col gap-1.5"><span class="skeleton h-3.5 w-[55%] rounded"></span><span class="skeleton h-2.5 w-[35%] rounded"></span></span><span class="skeleton h-3.5 w-[60px] rounded"></span></div>
            <div class="flex gap-3 items-center"><span class="skeleton w-10 h-10 rounded-tile"></span><span class="flex-1 flex flex-col gap-1.5"><span class="skeleton h-3.5 w-[62%] rounded"></span><span class="skeleton h-2.5 w-[40%] rounded"></span></span><span class="skeleton h-3.5 w-[68px] rounded"></span></div>
        </div>
    </div>
</main>

<script src="vendor/supabase.min.js"></script>
<script src="js/format.js"></script>
<script src="js/app.js"></script>
<script src="js/activity.js"></script>
</body>
</html>
