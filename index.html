<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home · Tabitha's Misery</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="main" class="page" aria-busy="true">
    <div class="flex flex-wrap gap-4 items-end justify-between">
        <div class="flex flex-col gap-0.5">
            <h1 class="page-title" id="greeting">Hi there.</h1>
            <p class="text-body-s md:text-body text-muted" id="greeting-sub">Counting the damage…</p>
        </div>
        <div class="hidden md:flex flex-wrap gap-3 items-center">
            <div class="flex items-center gap-2" data-month-host="pill"></div>
            <a href="add-transaction.html" class="btn btn-primary pl-3.5 pr-[18px]"><span class="ms text-[22px]" aria-hidden="true">add</span>Add transaction</a>
        </div>
    </div>
    <div class="md:hidden" data-month-host="switcher"></div>

    <div id="home-content" class="flex flex-col gap-4">
        <section class="card p-4 flex flex-col gap-3" aria-label="Spending this month">
            <span class="text-body-s text-muted" data-spent-label>Spent this month</span>
            <span class="skeleton w-60 max-w-full h-11 rounded-s"></span>
            <span class="skeleton w-44 h-3"></span>
            <span class="divider"></span>
            <span class="skeleton w-full h-2.5 rounded-full"></span>
            <span class="skeleton w-[70%] h-3"></span>
        </section>
        <div class="grid grid-cols-2 gap-3">
            <div class="card-m px-3.5 py-3 flex flex-col gap-2"><span class="text-label text-muted">Income</span><span class="skeleton w-28 h-4"></span></div>
            <div class="card-m px-3.5 py-3 flex flex-col gap-2"><span class="text-label text-muted">Net so far</span><span class="skeleton w-28 h-4"></span></div>
        </div>
        <section class="card px-4 pt-4 pb-3 flex flex-col gap-3" aria-label="Daily spending">
            <h2 class="section-title">Day by day</h2>
            <div class="flex items-end gap-[3px] h-[110px] border-b border-line" aria-hidden="true">
                <span class="skeleton flex-1 h-[40%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[20%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[35%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[60%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[15%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[25%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[45%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[30%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[50%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[70%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[38%] rounded-t-[3px] rounded-b-none"></span><span class="skeleton flex-1 h-[22%] rounded-t-[3px] rounded-b-none"></span>
            </div>
        </section>
    </div>
</main>

<script src="vendor/supabase.min.js"></script>
<script src="js/format.js"></script>
<script src="js/app.js"></script>
<script src="js/home.js"></script>
</body>
</html>
