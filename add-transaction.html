<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add transaction · Tabitha's Misery</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="main" class="page page--pushed page--narrow">
    <form id="txn-form" class="flex flex-col gap-4" novalidate>
        <div class="seg grid-cols-2" role="radiogroup" aria-label="Transaction type" id="type-seg">
            <button type="button" role="radio" aria-checked="true" data-type="DB"><span class="ms text-[18px]" aria-hidden="true">remove</span>Expense</button>
            <button type="button" role="radio" aria-checked="false" data-type="CR"><span class="ms text-[18px]" aria-hidden="true">add</span>Income</button>
        </div>

        <div class="card-m p-4 flex flex-col gap-1.5">
            <label for="amount" class="text-label font-medium text-muted">Amount</label>
            <div class="amount-line">
                <span class="rp" aria-hidden="true">Rp</span>
                <input id="amount" inputmode="numeric" placeholder="0" autocomplete="off" aria-describedby="amount-help">
                <button type="button" class="icon-btn icon-btn--tonal self-center" id="calc-open" aria-label="Open calculator"><span class="ms text-[22px]" aria-hidden="true">calculate</span></button>
            </div>
            <span id="amount-help" class="text-caption text-muted">Splitting a bill? Tap the calculator.</span>
        </div>

        <div>
            <label for="desc" class="field-label">Description</label>
            <input id="desc" class="field" placeholder="e.g. Nasi padang with Raka" autocomplete="off" aria-describedby="desc-error">
            <span id="desc-error" class="field-error" hidden></span>
        </div>

        <div>
            <label for="date-btn" class="field-label">Date</label>
            <div class="relative">
                <button type="button" id="date-btn" class="field-button"><span id="date-label">Today</span><span class="ms text-[20px] text-muted" aria-hidden="true">calendar_today</span></button>
                <input type="date" id="date" class="picker-input" tabindex="-1" aria-hidden="true">
            </div>
        </div>

        <fieldset id="cat-field" class="border-0 p-0 m-0">
            <legend class="field-label">Category</legend>
            <div id="cat-chips" class="flex flex-wrap gap-2"></div>
            <span class="field-help">Leave it blank and your rules will try to sort it.</span>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-lg mt-1" id="submit">Add expense</button>
        <button type="button" class="btn-text-destructive -mt-2" id="delete" hidden><span class="ms text-[20px]" aria-hidden="true">delete</span>Delete transaction</button>
    </form>
</main>

<script src="vendor/supabase.min.js"></script>
<script src="js/format.js"></script>
<script src="js/app.js"></script>
<script src="js/transaction-form.js"></script>
</body>
</html>
