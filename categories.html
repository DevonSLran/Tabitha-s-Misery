<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rules · Tabitha's Misery</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="main" class="page page--narrow !gap-4" aria-busy="true">
    <h1 class="page-title">Rules</h1>
    <div class="seg grid-cols-3" role="tablist" aria-label="Rules sections" id="tabs">
        <button type="button" role="tab" id="tab-sort" aria-controls="panel" aria-selected="true" data-tab="sort">To sort<span class="text-caption text-accent-text tnum" data-count="sort"></span></button>
        <button type="button" role="tab" id="tab-rules" aria-controls="panel" aria-selected="false" data-tab="rules">Rules<span class="text-caption text-muted tnum" data-count="rules"></span></button>
        <button type="button" role="tab" id="tab-categories" aria-controls="panel" aria-selected="false" data-tab="categories">Categories<span class="text-caption text-muted tnum" data-count="categories"></span></button>
    </div>
    <div id="panel" role="tabpanel" aria-labelledby="tab-sort" class="flex flex-col gap-3.5">
        <span class="skeleton h-4 w-[80%]"></span>
        <div class="card-m p-4 flex flex-col gap-3" aria-hidden="true"><span class="flex gap-3 items-center"><span class="skeleton w-10 h-10 rounded-tile"></span><span class="skeleton h-4 flex-1"></span></span><span class="skeleton h-9 w-full"></span></div>
    </div>
</main>

<script src="vendor/supabase.min.js"></script>
<script src="js/format.js"></script>
<script src="js/app.js"></script>
<script src="js/rules.js"></script>
</body>
</html>
